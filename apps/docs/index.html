<!doctype html>
<html lang="pt-BR" dir="ltr" data-forma-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Forma UI — playground de componentes headless e acessíveis." />
    <title>Forma UI — Playground headless</title>
    <style>
      :root{font:16px/1.5 system-ui,sans-serif;color:var(--forma-color-text,#172033);background:var(--forma-color-surface,#f8fafc)}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:1rem;top:1rem;background:white;padding:.75rem;z-index:9999}header{padding:1.5rem max(1rem,calc((100vw - 1100px)/2));background:#0f172a;color:#fff}header p{max-width:70ch;color:#cbd5e1}main{max-width:1100px;margin:auto;padding:1rem}.toolbar,.grid{display:flex;gap:1rem;flex-wrap:wrap}.toolbar{align-items:center;padding:1rem 0}.grid{align-items:stretch}.panel{background:var(--forma-color-surface,#fff);border:1px solid var(--forma-color-border,#cbd5e1);border-radius:.75rem;padding:1rem;margin:.5rem 0;flex:1 1 300px;min-width:0;color:var(--forma-color-text,#172033)}.panel h2{margin-top:0;font-size:1.15rem}.panel button,.toolbar button,.toolbar select{padding:.5rem .75rem;border:1px solid #64748b;border-radius:.375rem;background:var(--forma-color-surface,#fff);color:var(--forma-color-text,#172033);margin:.2rem}.demo-output{padding:.75rem;border:1px dashed #94a3b8;border-radius:.375rem;margin:.5rem 0;min-height:2rem}.overlay{position:fixed;inset:0;background:rgb(15 23 42 / .55);display:grid;place-items:center;z-index:20}.dialog{background:var(--forma-color-surface,#fff);color:var(--forma-color-text,#172033);padding:1.5rem;max-width:32rem;width:calc(100% - 2rem);border-radius:.75rem;box-shadow:0 12px 32px #0003}.hidden{display:none!important}.menu{border:1px solid var(--forma-color-border,#94a3b8);background:var(--forma-color-surface,#fff);color:var(--forma-color-text,#172033);padding:.5rem;border-radius:.5rem;display:inline-grid;gap:.25rem}.menu [role=menuitem]{text-align:left}.toast-list{position:fixed;right:1rem;bottom:1rem;z-index:40;display:grid;gap:.5rem;list-style:none;padding:0;max-width:24rem}.toast-list li{background:#0f172a;color:white;padding:.75rem 1rem;border-radius:.5rem;box-shadow:0 4px 16px #0003}.token-swatch{display:inline-block;width:1.5rem;height:1.5rem;border:1px solid #64748b;vertical-align:middle;margin-inline-end:.5rem}.inspector{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:#0b1220;color:#dbeafe;padding:.75rem;border-radius:.5rem;max-height:18rem;overflow:auto} [hidden]{display:none!important}:focus-visible{outline:3px solid var(--forma-color-focus,#1d4ed8);outline-offset:2px}
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header><h1>Forma UI</h1><p>Laboratório headless com 14 demonstrações, estados ARIA, foco, teclado, temas, direção RTL e auditoria automatizada. A aparência abaixo pertence somente a esta documentação.</p></header>
    <main id="main">
      <div id="toolbar" class="toolbar" role="group" aria-label="Configurações do playground"></div>
      <div id="app" aria-live="off"></div>
    </main>
    <ol id="toast-region" class="toast-list" aria-label="Notificações" aria-live="polite"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
