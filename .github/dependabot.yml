version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tooling:
        patterns: ['eslint*', 'prettier', 'typescript', 'vitest', 'rollup*']
      frameworks:
        patterns: ['react*', 'vue', 'svelte', 'solid-js', 'lit', '@angular/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
