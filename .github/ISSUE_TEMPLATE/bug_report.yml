name: Bug report
description: Report a reproducible issue
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: '@forma-ui/core 0.3.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
